# mini-swe-agent config for data-lake question answering.
# Derived from mini-swe-agent's `mini_textbased.yaml`: same agent loop and same text-based action format
# (exactly one ```mswea_bash_command block per turn). Only the task framing is changed from
# "fix this repository" to "answer this question from the data lake".
agent:
  system_template: |
    You are a data agent that answers questions by exploring a data lake with bash commands.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    THOUGHT: Your reasoning and analysis here. Explain why you want to perform the action.

    ```mswea_bash_command
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    Answer this question using the data in the data lake:

    <question>
    {{task}}
    </question>

    The current directory is the root of the data lake. It contains many dataset folders
    (e.g. `datagov/<dataset-name>/` and `wikipedia/<page-name>/`) with data files, metadata and documentation.
    Most of them are NOT relevant to the question. File extensions can be misleading
    (for example, a `.txt` file may contain CSV or JSON).

    ## Recommended Workflow

    1. Explore the lake to find the dataset(s) that can answer the question
    2. Inspect the relevant files: schema, column meanings, units, date formats, documentation
    3. Compute the answer with a script (python3 with pandas is available)
    4. Sanity-check the result (e.g. look at intermediate values)
    5. Submit your final answer by issuing exactly this command, replacing ANSWER with your answer:
       `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && echo "[ANSWER]"`
       <important>After this command, you cannot continue working on this task.</important>

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    4. Do not print entire large files; use head, wc, grep or a script instead. Long outputs are truncated.

    <system_information>
    {{system}} {{release}} {{machine}}
    </system_information>

    ## Formatting your response

    Here is an example of a correct response:

    <example_response>
    THOUGHT: I need to find out which datasets are in the lake first.

    ```mswea_bash_command
    ls datagov wikipedia
    ```
    </example_response>

    ## Useful command examples

    ### Look at the first lines of a file:

    ```mswea_bash_command
    head -n 5 path/to/file.txt
    ```

    ### Run a multi-line python script:

    ```mswea_bash_command
    python3 - <<'EOF'
    import pandas as pd
    df = pd.read_csv("path/to/file.txt")
    print(df.head())
    EOF
    ```
  step_limit: 20
  cost_limit: 1.0
  wall_time_limit_seconds: 600
  max_consecutive_format_errors: 3
environment:
  timeout: 60
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    PYTHONWARNINGS: ignore
model:
  cost_tracking: ignore_errors
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 6000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    </warning>
    {%- set elided_chars = output.output | length - 6000 -%}
    <output_head>
    {{ output.output[:3000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-3000:] }}
    </output_tail>
    {%- endif -%}
  model_kwargs:
    drop_params: true
    temperature: 0.0
  format_error_template: |
    {% if finish_reason is defined and finish_reason in ["length", "tool_calls"] -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a complete action, so it was cut off. Respond more concisely and provide exactly one action in the required format.
    {%- else -%}
    Format error:

    <error>
    {{error}}
    </error>

    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.

    Please format your action in triple backticks as shown in <response_example>.

    <response_example>
    THOUGHT: Here are some thoughts about why you want to perform the action.

    ```mswea_bash_command
    <action>
    ```
    </response_example>

    If you have completed your assignment, please consult the first message about how to
    submit your answer (you will not be able to continue working on this task after that).
    {%- endif %}
